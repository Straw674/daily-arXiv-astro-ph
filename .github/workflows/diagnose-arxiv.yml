name: arXiv HTTP diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arxiv-http-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Collect HTTP diagnostics
        env:
          EMAIL: ${{ vars.EMAIL }}
        run: .venv/bin/python scripts/diagnose_arxiv.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
